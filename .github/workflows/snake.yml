name: Generate Snake

# 贡献图小蛇:每天自动跑一次,也可以手动触发(Actions → Generate Snake → Run workflow)
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake svg
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=39d353&color_dots=161b22,0e4429,006d32,26a641,39d353
            dist/github-snake.svg?palette=github-light&color_snake=1a7f37&color_dots=ebedf0,9be9a8,40c463,30a14e,216e39

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
