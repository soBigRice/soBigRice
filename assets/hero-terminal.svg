<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380"
     font-family="'SF Mono','Cascadia Code','JetBrains Mono','Fira Code','Menlo',ui-monospace,monospace">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.52" stop-color="#30363d"/>
      <stop offset="1" stop-color="#ffb86b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="shell"><rect x="24" y="22" width="912" height="336" rx="20"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-size: 17px; }
      .tiny { font-size: 12px; letter-spacing: 1px; }
      .small { font-size: 14px; }
      .mid { font-size: 20px; }
      .big { font-size: 28px; font-weight: 700; }
      .muted { fill: #8b949e; }
      .text { fill: #c9d1d9; }
      .blue { fill: #58a6ff; }
      .amber { fill: #ffb86b; }
      .green { fill: #39d353; }
      .line { animation: reveal 720ms ease-out both; }
      .d1 { animation-delay: 120ms; }
      .d2 { animation-delay: 520ms; }
      .d3 { animation-delay: 920ms; }
      .d4 { animation-delay: 1320ms; }
      .d5 { animation-delay: 1720ms; }
      .scan { animation: scan 7s linear infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scan {
        from { transform: translateY(-80px); }
        to { transform: translateY(360px); }
      }
      @keyframes blink {
        0%, 48%, 100% { opacity: 1; }
        49%, 99% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: .72; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
    </style>
  </defs>

  <rect width="960" height="380" rx="26" fill="#050608"/>
  <rect x="18" y="16" width="924" height="348" rx="24" fill="url(#edge)" opacity="0.48" filter="url(#soft)"/>

  <g clip-path="url(#shell)">
    <rect x="24" y="22" width="912" height="336" fill="url(#panel)"/>
    <rect class="scan" x="24" y="-80" width="912" height="72" fill="#58a6ff" opacity="0.045"/>
    <path d="M24 112H936" stroke="#30363d"/>
    <path d="M642 112V358" stroke="#30363d"/>

    <rect x="24" y="22" width="912" height="54" fill="#0b1017"/>
    <circle cx="52" cy="49" r="7" fill="#ff5f56"/>
    <circle cx="76" cy="49" r="7" fill="#ffbd2e"/>
    <circle cx="100" cy="49" r="7" fill="#27c93f"/>
    <text x="136" y="54" class="muted small">MiaoZong CEO Console / employee_001 build room</text>
    <text x="890" y="54" text-anchor="end" class="amber small">ONLINE</text>

    <text x="52" y="104" class="tiny muted">CEO_STATUS / INSPECTION MODE</text>
    <text x="52" y="150" class="big text">喵总在巡视，米大饭在交付</text>
    <text x="54" y="184" class="line d1 text">老板提出需求、验收和署名；程序员小弟负责把想法做成能跑的产品。</text>

    <g class="line d2">
      <text x="54" y="230"><tspan class="green">➜</tspan> <tspan class="muted">~</tspan> <tspan class="text">whoami</tspan></text>
      <text x="54" y="260"><tspan class="blue">米大饭 / soBigRice</tspan> <tspan class="muted">· self-taught developer · since 2020</tspan></text>
    </g>

    <g class="line d3">
      <text x="54" y="306"><tspan class="green">➜</tspan> <tspan class="muted">~/approved-builds</tspan> <tspan class="text">ls</tspan></text>
      <text x="54" y="334"><tspan class="blue">port-guardian</tspan>  <tspan class="blue">three-shaders</tspan>  <tspan class="blue">oh-fans</tspan>  <tspan class="blue">wifiCalendar</tspan> <tspan class="blink green">█</tspan></text>
    </g>

    <g transform="translate(678 136)" class="line d4">
      <rect x="0" y="0" width="208" height="168" rx="18" fill="#0d1117" stroke="#30363d"/>
      <path d="M65 64L84 36L105 64Z" fill="#ffb86b" opacity="0.9"/>
      <path d="M106 64L127 36L146 64Z" fill="#ffb86b" opacity="0.9"/>
      <rect x="54" y="56" width="104" height="78" rx="34" fill="#ffb86b"/>
      <circle cx="88" cy="92" r="7" fill="#0d1117"/>
      <circle cx="124" cy="92" r="7" fill="#0d1117"/>
      <path d="M103 106L112 106L107.5 113Z" fill="#0d1117"/>
      <path d="M82 121C98 132 118 132 134 121" fill="none" stroke="#0d1117" stroke-width="5" stroke-linecap="round"/>
      <rect x="34" y="142" width="140" height="1" fill="#30363d"/>
      <text x="104" y="160" text-anchor="middle" class="tiny amber">MIAOZONG / CEO</text>
    </g>

    <g class="line d5">
      <circle cx="884" cy="110" r="6" fill="#39d353" class="pulse"/>
      <text x="868" y="334" text-anchor="end" class="tiny muted">approved by cat, shipped by human</text>
    </g>
  </g>

  <rect x="24" y="22" width="912" height="336" rx="20" fill="none" stroke="#30363d" stroke-width="1.4"/>
</svg>
