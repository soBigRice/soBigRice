<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 322" width="820" height="322"
     font-family="'SF Mono','Cascadia Code','JetBrains Mono','Fira Code','Menlo',ui-monospace,monospace">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <clipPath id="win"><rect x="10" y="10" width="800" height="300" rx="12"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .l   { clip-path: inset(0 100% 0 0); animation: type 1.3s steps(28) both; }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
      .cur { opacity: 0; animation: blink 1.05s steps(1) 8.2s infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      .scan{ animation: scan 7s linear infinite; }
      @keyframes scan { from { transform: translateY(46px); } to { transform: translateY(312px); } }
      .p  { fill:#39d353; } .c { fill:#c9d1d9; } .o { fill:#58a6ff; }
      .hi { fill:#39d353; } .dim { fill:#6e7681; } .y { fill:#e3b341; }
      text{ font-size:18px; }
    </style>
  </defs>

  <g clip-path="url(#win)">
    <rect x="10" y="10" width="800" height="300" fill="#0d1117"/>
    <rect class="scan" x="10" y="0" width="800" height="60" fill="#39d353" opacity="0.04"/>

    <!-- title bar -->
    <rect x="10" y="10" width="800" height="40" fill="#161b22"/>
    <circle cx="36" cy="30" r="6" fill="#ff5f56"/>
    <circle cx="58" cy="30" r="6" fill="#ffbd2e"/>
    <circle cx="80" cy="30" r="6" fill="#27c93f"/>
    <text x="410" y="35" text-anchor="middle" class="dim" font-size="14">— soBigRice · 米大饭@github · — zsh —</text>
    <rect x="10" y="50" width="800" height="2" fill="url(#accent)" opacity="0.7"/>

    <!-- body -->
    <g class="l" style="animation-delay:.2s">
      <text x="34" y="90"><tspan class="p">➜</tspan> <tspan class="dim">~</tspan> <tspan class="c">whoami</tspan></text>
    </g>
    <g class="l" style="animation-delay:1.5s">
      <text x="34" y="120"><tspan class="o">米大饭 / soBigRice</tspan> <tspan class="dim">·</tspan> <tspan class="hi">自学型开发者 / self-taught</tspan></text>
    </g>
    <g class="l" style="animation-delay:2.8s">
      <text x="34" y="156"><tspan class="p">➜</tspan> <tspan class="dim">~</tspan> <tspan class="c">cat motto.txt</tspan></text>
    </g>
    <g class="l" style="animation-delay:4.1s">
      <text x="34" y="186"><tspan class="y">人生如戏,我负责加戏。代码能跑就行,跑得好看更妙。</tspan></text>
    </g>
    <g class="l" style="animation-delay:5.4s">
      <text x="34" y="222"><tspan class="p">➜</tspan> <tspan class="dim">~</tspan> <tspan class="c">ls ~/now-building/</tspan></text>
    </g>
    <g class="l" style="animation-delay:6.7s">
      <text x="34" y="252"><tspan class="o">port-guardian</tspan>  <tspan class="o">three-shaders</tspan>  <tspan class="o">灵动岛</tspan>  <tspan class="o">wifi-calendar</tspan></text>
    </g>
    <text x="34" y="288" filter="url(#glow)"><tspan class="p">➜</tspan> <tspan class="dim">~</tspan> <tspan class="cur" fill="#39d353">█</tspan></text>
  </g>
</svg>
