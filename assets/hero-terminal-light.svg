<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 322" width="820" height="322"
     font-family="'SF Mono','Cascadia Code','JetBrains Mono','Fira Code','Menlo',ui-monospace,monospace">
  <defs>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a7f37"/>
      <stop offset="1" stop-color="#0969da"/>
    </linearGradient>
    <clipPath id="winL"><rect x="10" y="10" width="800" height="300" rx="12"/></clipPath>
    <filter id="glowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .l   { clip-path: inset(0 100% 0 0); animation: typeL 1.3s steps(28) both; }
      @keyframes typeL { to { clip-path: inset(0 0 0 0); } }
      .cur { opacity: 0; animation: blinkL 1.05s steps(1) 8.2s infinite; }
      @keyframes blinkL { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      .scan{ animation: scanL 7s linear infinite; }
      @keyframes scanL { from { transform: translateY(46px); } to { transform: translateY(312px); } }
      .p  { fill:#1a7f37; } .c { fill:#1f2328; } .o { fill:#0969da; }
      .hi { fill:#1a7f37; } .dim { fill:#59636e; } .y { fill:#9a6700; }
      text{ font-size:18px; }
    </style>
  </defs>

  <g clip-path="url(#winL)">
    <rect x="10" y="10" width="800" height="300" fill="#ffffff"/>
    <rect class="scan" x="10" y="0" width="800" height="60" fill="#1a7f37" opacity="0.04"/>

    <!-- title bar -->
    <rect x="10" y="10" width="800" height="40" fill="#f6f8fa"/>
    <circle cx="36" cy="30" r="6" fill="#ff5f56"/>
    <circle cx="58" cy="30" r="6" fill="#ffbd2e"/>
    <circle cx="80" cy="30" r="6" fill="#27c93f"/>
    <text x="410" y="35" text-anchor="middle" class="dim" font-size="14">— soBigRice · 米大饭@github · — zsh —</text>
    <rect x="10" y="50" width="800" height="2" fill="url(#accentL)" opacity="0.8"/>

    <!-- body -->
    <g class="l" style="animation-delay:.2s">
      <text x="34" y="90"><tspan class="p">➜</tspan> <tspan class="dim">~</tspan> <tspan class="c">whoami</tspan></text>
    </g>
    <g class="l" style="animation-delay:1.5s">
      <text x="34" y="120"><tspan class="o">米大饭 / soBigRice</tspan> <tspan class="dim">·</tspan> <tspan class="hi">自学型开发者 / self-taught</tspan></text>
    </g>
    <g class="l" style="animation-delay:2.8s">
      <text x="34" y="156"><tspan class="p">➜</tspan> <tspan class="dim">~</tspan> <tspan class="c">cat motto.txt</tspan></text>
    </g>
    <g class="l" style="animation-delay:4.1s">
      <text x="34" y="186"><tspan class="y">人生如戏,我负责加戏。代码能跑就行,跑得好看更妙。</tspan></text>
    </g>
    <g class="l" style="animation-delay:5.4s">
      <text x="34" y="222"><tspan class="p">➜</tspan> <tspan class="dim">~</tspan> <tspan class="c">ls ~/now-building/</tspan></text>
    </g>
    <g class="l" style="animation-delay:6.7s">
      <text x="34" y="252"><tspan class="o">port-guardian</tspan>  <tspan class="o">three-shaders</tspan>  <tspan class="o">灵动岛</tspan>  <tspan class="o">wifi-calendar</tspan></text>
    </g>
    <text x="34" y="288" filter="url(#glowL)"><tspan class="p">➜</tspan> <tspan class="dim">~</tspan> <tspan class="cur" fill="#1a7f37">█</tspan></text>
  </g>
  <rect x="10" y="10" width="800" height="300" rx="12" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
</svg>
